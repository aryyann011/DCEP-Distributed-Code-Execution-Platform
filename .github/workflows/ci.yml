name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    # Fresh Postgres + Redis started inside Docker on the runner,
    # before any of our steps execute. Health checks gate on readiness.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: dcep
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/dcep
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      PORT: 3000

    steps:
      # 1. Download the repo into the runner VM
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Node 20 + cache node_modules keyed on package-lock.json
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Exact installs from the lockfile (reproducible, unlike npm install)
      - name: Install dependencies
        run: npm ci

      # 4. Fresh VM = empty Postgres. Build schema, then seed one problem
      #    (queue.test.js needs a real problems row for the FK).
      - name: Apply database schema
        run: node src/shared/database/setup-db.js

      - name: Seed database
        run: node src/shared/database/seed.js

      # 5. Start the API server in the background (raw node, no nodemon),
      #    wait for /health to return 200 before testing.
      - name: Start API server
        run: |
          node src/api/server.js &
          for i in $(seq 1 30); do
            if curl -f http://localhost:3000/health > /dev/null 2>&1; then
              echo "Server is healthy"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server failed to become healthy"; exit 1
            fi
            sleep 1
          done

      # 6. The actual gate. Fails the whole workflow on any test failure.
      - name: Run tests
        run: npm test
